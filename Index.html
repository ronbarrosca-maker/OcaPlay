<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCAPLAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div id="finestra-menu">
        <div class="sole"></div>
        <div class="barrasuperiore">
            <div class="bottonechiudi" onclick="Chiudifinestra()">✕</div>
        </div>
        <div class="contenutomenu">
            <h1><span class="titolonero">Oca</span><span class="titoloarancio">Play</span></h1>
            <div class="scatolacontenitore">
                <div class="testogiocatori">QUANTI GIOCATORI?</div>
                <div class="selettoregiocatori">
                    <div class="bottonefreccia" onclick="diminuisciGiocatori()">-</div>
                    <div class="boxnumero" id="conteggio-giocatori">2</div>
                    <div class="bottonefreccia" onclick="aumentaGiocatori()">+</div>
                </div>
            </div>
            <button class="tastoavvio" onclick="gestisciAvanti()">AVANTI</button>
        </div>
    </div>

    
    <div id="finestra-nomi" class="nascosto">
        <div class="sole"></div>
        <div class="contenutomenu">
            <h1><span class="titolonero">Oca</span><span class="titoloarancio">Play</span></h1>
            <div class="scatolacontenitore">
                <div class="titolonomi">Inserisci Nomi</div>
                <div id="listainput"></div>
            </div>
            <div class="spaziobottoni">
                <button class="bottoneavvio" onclick="tornaindietro()">INDIETRO</button>
                <button class="bottoneavvio" onclick="GiocaAvanti()">GIOCA!</button>
            </div>
        </div>
    </div>

    <div id="schermo-gioco" class="nascosto">
        <div class="contenitore-gioco">
            <header style="text-align: center; height: 30px;">
                <h1 style="font-size: 1.2rem; margin: 0;"><span class="titolonero">Oca</span><span class="titoloarancio">Play</span></h1>
            </header>
            <main class="area-mappa">
                <div id="campo-gioco" class="parent">
                    
                </div>
            </main>
            <footer class="controlli-gioco" style="display:flex; gap:10px; height:80px; margin-top:10px;">
                <div class="scatola-info" style="flex:1; background:white; border:2px solid #333; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <span class="etichetta">Turno</span>
                    <div id="testo-stato" style="font-weight:bold">...</div>
                </div>
                <div class="scatola-info" style="flex:1; background:white; border:2px solid #333; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <span class="etichetta">Dado</span>
                    <div id="testo-risultato" style="font-weight:bold; font-size:1.5rem">-</div>
                </div>
                <button class="btn-lancio" style="flex:1; border-radius:8px; font-size:1.2rem" onclick="gestisciLancio()">TIRA!</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
